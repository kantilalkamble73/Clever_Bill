# Optional: run the Vite dev server in Docker (no local Node needed).
# Without Docker, just run: npm install && npm run dev
services:
  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API: ${VITE_API:-http://localhost:8080/api}
    ports: ["5173:5173"]
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
volumes:
  node_modules:
