services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: cleverpos
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d cleverpos"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
