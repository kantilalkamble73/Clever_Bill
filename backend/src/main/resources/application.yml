server:
  port: 8080
spring:
  config:
    import:
      - "optional:application-local.yml"
  datasource:
    url: jdbc:postgresql://localhost:5432/cleverpos
    username: postgres
    password: postgre123
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
app:
  jwt-secret: change-this-secret-key-must-be-at-least-32-chars-long
  ai:
    provider: gemini
    gemini-key: ${GEMINI_API_KEY:}
    gemini-model: gemini-3.8-flash